const ACC=[["#0e9f8e","#5b8cff"],["#7c5cff","#ff6bd6"],["#ff7a59","#ffb347"],["#2f8cff","#27d3c1"],["#ec4899","#f59e0b"],["#22a06b","#a3e635"]];
let db={classes:[],cur:null,theme:"auto",acc:0,thr:75,lang:null},C;
function iso(d){const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&(Array.isArray(s.students)||Array.isArray(s.classes)))db=Object.assign(db,s)}catch(e){}
if(!db.lang)db.lang=(LANGS.find(l=>(navigator.language||"").startsWith(l[0]))||LANGS[1])[0];
const li=()=>Math.max(0,LANGS.findIndex(l=>l[0]===db.lang)),loc=()=>LANGS[li()][2];
const t=(k,...a)=>{let s=(T[k]||"").split("|")[li()]||"";a.forEach((v,i)=>s=s.split("{"+i+"}").join(v));return s};
const n=x=>Number(x).toLocaleString(loc(),{maximumFractionDigits:1});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast(t("noSpace"))}};
const schoolName=()=>C.name||t("app");
let tab="att",day=iso(new Date()),repMonth=day.slice(0,7),q="",calM=day.slice(0,7),selDay=null;
const TABS=[["att","M5 13l4 4L19 7"],["cal","M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"],["stu","M16 11a4 4 0 10-8 0 4 4 0 008 0zM4 21c0-4 4-6 8-6s8 2 8 6"],["rep","M4 20V10M10 20V4M16 20v-8M22 20H2"],["set","M12 15a3 3 0 100-6 3 3 0 000 6zM19 12l2-1-2-4-2 1-2-1-1-2H9L8 7 6 8 4 7l-2 4 2 1v2l-2 1 2 4 2-1 2 1 1 2h4l1-2 2-1 2 1 2-4-2-1z"]];
function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove("show"),1800)}
function applyTheme(){const r=document.documentElement,[a,b]=ACC[db.acc]||ACC[0];r.dataset.theme=db.theme==="auto"?"":db.theme;r.lang=db.lang;r.style.setProperty("--acc",a);r.style.setProperty("--acc2",b)}
document.addEventListener("pointerdown",e=>{const el=e.target.closest(".btn,.seg button,.sw button,nav button,.ct,.cal button");if(!el)return;el.classList.add("press");const r=el.getBoundingClientRect();el.style.setProperty("--x",(e.clientX-r.left)+"px");el.style.setProperty("--y",(e.clientY-r.top)+"px");el.classList.add("down");const up=()=>{el.classList.remove("down");removeEventListener("pointerup",up);removeEventListener("pointercancel",up)};addEventListener("pointerup",up);addEventListener("pointercancel",up)});
const monthName=ym=>{const[y,m]=ym.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString(loc(),{month:"long",year:"numeric"})};
const pd=x=>{const[y,m,d]=(x||"").split("-").map(Number);return new Date(y||2000,(m||1)-1,d||1)};
const fmtD=x=>pd(x).toLocaleDateString(loc(),{day:"numeric",month:"long",year:"numeric"});
function elapsed(){const s=pd(C.start),real=new Date();real.setHours(0,0,0,0);const e=C.end?pd(C.end):null,over=!!(e&&real>e),now=over?e:real,span=e?Math.round((e-s)/864e5)+1:0;
  if(now<s)return{future:true,mo:0,d:0,total:0,over:false,span};
  let mo=(now.getFullYear()-s.getFullYear())*12+now.getMonth()-s.getMonth(),a=new Date(s);a.setMonth(a.getMonth()+mo);if(a>now){mo--;a=new Date(s);a.setMonth(a.getMonth()+mo)}
  return{mo,d:Math.round((now-a)/864e5),total:Math.round((now-s)/864e5)+1,over,span}}
const rollNum=r=>parseInt(String(r).replace(/[০-৯]/g,d=>"০১২৩৪৫৬৭৮৯".indexOf(d)))||1e9;
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const avatar=s=>`<div class="av" style="background:linear-gradient(135deg,hsl(${hue(s.name)} 70% 52%),hsl(${(hue(s.name)+50)%360} 70% 45%))">${esc([...s.name.trim()][0]||"?").toUpperCase()}</div>`;
function counts(d){const r=C.att[d]||{},c={P:0,A:0,L:0};C.students.forEach(s=>r[s.id]&&c[r[s.id]]++);c.un=C.students.length-c.P-c.A-c.L;c.pct=C.students.length?Math.round((c.P+c.L)/C.students.length*100):0;return c}
function stats(prefix){const days=Object.keys(C.att).filter(d=>d.startsWith(prefix));return{days,rows:C.students.map(s=>{let P=0,A=0,L=0;days.forEach(d=>{const k=C.att[d][s.id];k==="P"?P++:k==="A"?A++:k==="L"&&L++});const tt=P+A+L;return{s,P,A,L,t:tt,pct:tt?(P+L)/tt*100:null}})}}

function render(){applyTheme();$("#pill").style.transform=`translateX(${TABS.findIndex(x=>x[0]===tab)*100}%)`;
  $("#nav").querySelectorAll("button").forEach(b=>b.remove());
  TABS.forEach(([k,p])=>{const b=document.createElement("button");b.className=k===tab?"on":"";b.innerHTML=`<svg viewBox="0 0 24 24"><path d="${p}"/></svg>${t("t"+k[0].toUpperCase()+k.slice(1))}`;b.onclick=()=>{tab=k;render();scrollTo(0,0)};$("#nav").appendChild(b)});
  $("#app").innerHTML=header()+({att:vAtt,cal:vCal,stu:vStu,rep:vRep,set:vSet})[tab]()+`<p class="credit">${t("credit")} <b>Remote Studios</b></p>`}
const header=()=>`<div class="top"><h1>${esc(C.name||t("app"))}${C.subject?`<small>${esc(C.subject)}</small>`:""}</h1><select aria-label="${t("lang")}" onchange="db.lang=this.value;save();render()">${LANGS.map(l=>`<option value="${l[0]}" ${l[0]===db.lang?"selected":""}>${l[1]}</option>`).join("")}</select></div>
<div class="chips">${db.classes.map(c=>`<button class="ct ${c.id===C.id?"on":""}" onclick="setClass('${c.id}')">${esc(c.name||t("app"))}</button>`).join("")}<button class="ct" onclick="addClass()">＋ ${t("addCls")}</button></div>`;

function vAtt(){const e=elapsed(),c=counts(day),R=44,CIR=2*Math.PI*R,low=stats("").rows.filter(r=>r.t>=3&&r.pct<db.thr).map(r=>r.s.name);
  const bars=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const k=iso(d),has=C.att[k];const p=has?counts(k).pct:0;return`<div><i style="height:${Math.max(4,p*.62)}px;${has?"":"opacity:.25"}"></i>${d.toLocaleDateString(loc(),{weekday:"narrow"})}</div>`}).join("");
  return `<p class="sub">${e.future?t("notYet"):t("since",fmtD(C.start),n(e.mo),n(e.d))+(e.over?" · "+t("finished"):"")}</p>
  ${day in C.hol?`<div class="glass warn">${t("holBanner",esc(C.hol[day]||"–"))} · ${fmtD(day)}</div>`:""}
  <div class="glass"><div class="hero"><div class="ring"><svg width="104" height="104" viewBox="0 0 104 104"><circle cx="52" cy="52" r="${R}" fill="none" stroke="rgba(127,127,127,.25)" stroke-width="9"/><circle cx="52" cy="52" r="${R}" fill="none" stroke="var(--acc)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${CIR}" stroke-dashoffset="${CIR*(1-c.pct/100)}" style="transition:stroke-dashoffset .9s cubic-bezier(.34,1.2,.64,1)"/></svg><b>${n(c.pct)}%</b></div>
  <div class="stats"><div><b style="color:var(--P)">${n(c.P)}</b><span>${t("pres")}</span></div><div><b style="color:var(--A)">${n(c.A)}</b><span>${t("abs")}</span></div><div><b style="color:var(--L)">${n(c.L)}</b><span>${t("late")}</span></div><div><b>${n(c.un)}</b><span>${t("left")}</span></div></div></div></div>
  <div class="glass"><label style="margin-top:0">${t("date")}</label><input type="date" value="${day}" onchange="day=this.value||day;render()"><label>${t("last7")}</label><div class="chart">${bars}</div></div>
  ${low.length?`<div class="glass warn">${t("low",esc(low.slice(0,5).join(", "))+(low.length>5?" +"+n(low.length-5):""))}</div>`:""}
  ${C.students.length?`<div class="row" style="margin-bottom:12px"><button class="btn main" onclick="bulk('P')">${t("allP")}</button><button class="btn" onclick="bulk('')">${t("clear")}</button></div>
  <div class="glass">${C.students.map(s=>{const k=(C.att[day]||{})[s.id];return`<div class="st">${avatar(s)}<div class="nm"><b>${esc(s.name)}</b><small>${s.roll?t("roll",esc(s.roll)):""}</small></div><div class="seg">${["P","A","L"].map(m=>`<button data-s="${m}" class="${k===m?"on":""}" onclick="mark('${s.id}','${m}')">${t("s"+m)}</button>`).join("")}</div></div>`}).join("")}</div>
  <button class="btn" style="width:100%" onclick="shareDay()">${t("share")}</button>`
  :`<div class="glass empty">${t("noStu")}<br><br><button class="btn main" onclick="tab='stu';render()">${t("addStu")}</button></div>`}`}
function mark(id,k){const r=C.att[day]=C.att[day]||{};r[id]===k?delete r[id]:r[id]=k;if(!Object.keys(r).length)delete C.att[day];save();render();toast(t("saved"))}
function bulk(k){const r={};if(k)C.students.forEach(s=>r[s.id]=k);Object.keys(r).length?C.att[day]=r:delete C.att[day];save();render();toast(t("saved"))}
function shareDay(){const c=counts(day),txt=`${schoolName()} · ${day}\n${t("pres")}: ${c.P}\n${t("abs")}: ${c.A}\n${t("late")}: ${c.L}\n${t("left")}: ${c.un}\n${n(c.pct)}%`;
  if(navigator.share)navigator.share({text:txt}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast(t("copied")))}

function vStu(){const f=C.students.filter(s=>(s.name+" "+s.roll).toLowerCase().includes(q.toLowerCase()));
  return `<p class="sub">${t("total",n(C.students.length))}</p>
  <div class="glass"><h2>${t("paste")}</h2><textarea id="paste" rows="5" placeholder="${t("hint")}"></textarea><div class="row" style="margin-top:10px"><button class="btn main" onclick="addBulk()">${t("addList")}</button></div></div>
  ${C.students.length>6?`<input id="q" style="margin-bottom:12px" placeholder="${t("search")}" value="${esc(q)}" oninput="q=this.value;const p=this.selectionStart;render();$('#q').focus();$('#q').setSelectionRange(p,p)">`:""}
  <div class="glass">${f.length?f.map(s=>`<div class="st">${avatar(s)}<div class="nm"><b>${esc(s.name)}</b><small>${s.roll?t("roll",esc(s.roll)):t("noRoll")}</small></div><button class="btn" style="flex:0" onclick="editS('${s.id}')">${t("edit")}</button><button class="btn bad" style="flex:0" onclick="delS('${s.id}')">${t("del")}</button></div>`).join(""):`<div class="empty">${t("noStu")}</div>`}</div>`}
function addBulk(){let a=0,dup=0;$("#paste").value.split(/\n/).map(l=>l.trim()).filter(Boolean).forEach(l=>{const m=l.match(/^([0-9০-৯]+)[\s.,)\-:]+(.+)$/),roll=m?m[1]:"",name=(m?m[2]:l).trim();
  if(roll&&C.students.some(s=>s.roll===roll)){dup++;return}C.students.push({id:uid(),name,roll});a++});
  C.students.sort((x,y)=>rollNum(x.roll)-rollNum(y.roll));save();render();toast(t("added",n(a))+(dup?" "+t("skipped",n(dup)):""))}
function editS(id){const s=C.students.find(x=>x.id===id),nm=prompt(t("name"),s.name);if(nm===null)return;const r=prompt(t("rollQ"),s.roll);if(r===null)return;
  if(!nm.trim())return toast(t("nameEmpty"));if(r.trim()&&C.students.some(x=>x.id!==id&&x.roll===r.trim()))return toast(t("dupRoll"));s.name=nm.trim();s.roll=r.trim();C.students.sort((x,y)=>rollNum(x.roll)-rollNum(y.roll));save();render();toast(t("done"))}
function delS(id){const s=C.students.find(x=>x.id===id);if(!confirm(t("delQ",s.name)))return;C.students=C.students.filter(x=>x.id!==id);Object.values(C.att).forEach(r=>delete r[id]);save();render();toast(t("done"))}

function vRep(){const{days,rows}=stats(repMonth);
  return `<p class="sub">${t("repSub")}</p><div class="glass"><label style="margin-top:0">${t("month")}</label><input type="month" value="${repMonth}" onchange="repMonth=this.value||repMonth;render()"><p class="sub" style="margin:10px 0 0">${t("taken",monthName(repMonth),n(days.length))}</p></div>
  <div class="glass">${rows.length?`<table><tr><th>${t("name")}</th><th>${t("sP")}</th><th>${t("sA")}</th><th>${t("sL")}</th><th>%</th></tr>${rows.map(r=>`<tr><td>${esc(r.s.name)}</td><td>${n(r.P)}</td><td>${n(r.A)}</td><td>${n(r.L)}</td><td><span class="chip" style="${r.pct!==null&&r.t>=3&&r.pct<db.thr?"color:var(--A)":""}">${r.pct===null?"–":n(Math.round(r.pct))}</span></td></tr>`).join("")}</table>`:`<div class="empty">${t("noRep")}</div>`}</div>
  <div class="row"><button class="btn main" onclick="csv('${repMonth}')">${t("csvM")}</button><button class="btn" onclick="csv('')">${t("csvAll")}</button></div>`}
function csv(p){const{rows}=stats(p),qq=v=>'"'+String(v).replace(/"/g,'""')+'"';
  dl("\ufeff"+[[t("name"),t("roll","").trim(),t("pres"),t("abs"),t("late"),"%"].map(qq).join(",")].concat(rows.map(r=>[qq(r.s.name),qq(r.s.roll),r.P,r.A,r.L,r.pct===null?"":r.pct.toFixed(1)].join(","))).join("\n"),`attendance-${p||"all"}.csv`,"text/csv")}
function dl(text,name,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:type+";charset=utf-8"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast(t("fileMade"))}

function vSet(){const e=elapsed(),p=e.span?Math.min(100,Math.round(e.total/e.span*100)):0;
  return `<p class="sub">${t("local")}</p>
  <div class="glass"><h2>${t("cls")}</h2><label style="margin-top:0">${t("clsName")}</label><input value="${esc(C.name)}" placeholder="${esc(t("app"))}" onchange="C.name=this.value.trim();save();render()">
  <label>${t("subj")}</label><input value="${esc(C.subject)}" onchange="C.subject=this.value.trim();save();render()">
  <label>${t("startD")}</label><input type="date" value="${C.start}" onchange="C.start=this.value||C.start;save();render()">
  <label>${t("endD")}</label><input type="date" value="${C.end}" onchange="C.end=this.value;save();render()">
  <label>${t("thr")}</label><input type="number" min="1" max="100" value="${db.thr}" onchange="db.thr=Math.min(100,Math.max(1,+this.value||75));save();render()">
  ${e.span?`<div class="bar"><i style="width:${p}%"></i></div>`:""}<p class="sub" style="margin:8px 0 12px">${e.future?t("notYet"):(e.over?t("finished")+" · ":"")+(e.span?t("prog",n(e.mo),n(e.d),n(e.total),n(p)):t("since",fmtD(C.start),n(e.mo),n(e.d)))}</p>
  <button class="btn bad" style="width:100%" onclick="delClass()">${t("delCls")}</button></div>
  <div class="glass"><h2>${t("accent")}</h2><div class="sw">${ACC.map((c,i)=>`<button class="${i===db.acc?"on":""}" style="background:linear-gradient(135deg,${c[0]},${c[1]})" onclick="db.acc=${i};save();render()"></button>`).join("")}</div>
  <label>${t("theme")}</label><div class="row">${["auto","light","dark"].map(k=>`<button class="btn ${db.theme===k?"main":""}" onclick="db.theme='${k}';save();render()">${t(k)}</button>`).join("")}</div></div>
  <div class="glass"><h2>${t("backup")}</h2><p class="sub" style="margin:0 0 10px">${t("backupSub")}</p><div class="row"><button class="btn main" onclick="dl(JSON.stringify(db),'glassroll-backup-'+iso(new Date())+'.json','application/json')">${t("bkDl")}</button><button class="btn" onclick="$('#rf').click()">${t("bkRs")}</button></div><input id="rf" type="file" accept=".json" hidden onchange="restore(this.files[0])"></div>
  <div class="glass"><button class="btn bad" style="width:100%" onclick="wipe()">${t("wipe")}</button></div>`}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d!=="object")throw 0;
  const okC=c=>c&&Array.isArray(c.students)&&c.att&&typeof c.att==="object";if(!(Array.isArray(d.classes)?d.classes.length&&d.classes.every(okC):okC(d)))throw 0;
  const cl=d.classes||[d],ns=cl.reduce((a,c)=>a+c.students.length,0),nd=cl.reduce((a,c)=>a+Object.keys(c.att).length,0);
  if(!confirm(t("restoreQ",n(ns),n(nd))))return;db=Object.assign({theme:"auto",acc:0,thr:75,lang:db.lang,classes:[],cur:null},d);init();save();render();toast(t("done"))}catch(e){toast(t("badFile"))}};r.readAsText(f)}
function wipe(){if(confirm(t("wipeQ"))){db.classes=[];delete db.students;init();save();render();toast(t("done"))}}
/* ---- classes ---- */
function newClass(name){return{id:uid(),name:name||"",subject:"",start:iso(new Date()),end:"",students:[],att:{},hol:{},notes:{},periods:[]}}
function init(){
  if(!Array.isArray(db.classes)||!db.classes.length){const o=newClass(db.school&&db.school.name);
    if(Array.isArray(db.students)){o.students=db.students;o.att=db.att||{};if(db.school&&db.school.start)o.start=db.school.start.length===7?db.school.start+"-01":db.school.start}
    db.classes=[o]}
  delete db.students;delete db.att;delete db.school;
  db.classes.forEach(c=>{c.hol=c.hol||{};c.periods=Array.isArray(c.periods)?c.periods:[];c.notes=c.notes||{};c.subject=c.subject||"";c.end=c.end||"";c.name=c.name||""});
  C=db.classes.find(c=>c.id===db.cur)||db.classes[0];db.cur=C.id}
function setClass(id){C=db.classes.find(c=>c.id===id)||C;db.cur=C.id;selDay=null;save();render()}
function addClass(){const nm=prompt(t("clsName"),"");if(nm===null)return;C=newClass(nm.trim());db.classes.push(C);db.cur=C.id;save();tab="set";render();scrollTo(0,0)}
function delClass(){if(db.classes.length<2)return toast(t("lastCls"));if(!confirm(t("delClsQ",C.name||t("app"))))return;db.classes=db.classes.filter(c=>c!==C);C=db.classes[0];db.cur=C.id;save();render();toast(t("done"))}
/* ---- calendar, holidays, notes ---- */
function calMove(x){const[y,m]=calM.split("-").map(Number);calM=iso(new Date(y,m-1+x,1)).slice(0,7);selDay=null;render()}
function holiday(k){if(k in C.hol)delete C.hol[k];else{const r=prompt(t("holWhy"),"");if(r===null)return;if(C.att[k]){if(!confirm(t("holWarn")))return;delete C.att[k]}C.hol[k]=r.trim()}save();render();toast(t("done"))}
function noteDay(k){const v=prompt(t("addNote"),C.notes[k]||"");if(v===null)return;v.trim()?C.notes[k]=v.trim():delete C.notes[k];save();render();toast(t("saved"))}
function vCal(){const[y,m]=calM.split("-").map(Number),lead=new Date(y,m-1,1).getDay(),dim=new Date(y,m,0).getDate(),td=iso(new Date());
  let cells=[...Array(7)].map((_,i)=>`<small>${new Date(2023,0,1+i).toLocaleDateString(loc(),{weekday:"narrow"})}</small>`).join("")+"<span></span>".repeat(lead);
  for(let d=1;d<=dim;d++){const k=calM+"-"+String(d).padStart(2,"0"),has=C.att[k],out=(C.start&&k<C.start)||(C.end&&k>C.end),ps=C.periods.some(q=>q.from===k),pe=C.periods.some(q=>q.to===k),inp=C.periods.some(q=>k>=q.from&&k<=(q.to||td)),cls=[inp&&"inp",k in C.hol&&"hol",out&&"out",k===td&&"td",k===selDay&&"sel"].filter(Boolean).join(" ");
    cells+=`<button class="${cls}" onclick="selDay='${k}';render()">${ps?"<u>▶</u>":pe?"<u>■</u>":""}${n(d)}${has?`<i style="background:var(--${counts(k).pct>=db.thr?"P":"A"})"></i>`:""}</button>`}
  const hs=Object.keys(C.hol).filter(k=>k.startsWith(calM)).sort();
  return `<div class="glass"><div class="calh"><button class="btn" onclick="calMove(-1)">‹</button><b>${monthName(calM)}</b><button class="btn" onclick="calMove(1)">›</button></div><div class="cal">${cells}</div>
  <div class="lg"><span style="--c:var(--P)">${t("rec")}</span><span style="--c:var(--A)">&lt;${n(db.thr)}%</span><span style="--c:var(--L)">${t("holiday")}</span><span style="--c:var(--acc)">▶ ${t("startL")} · ■ ${t("finishL")}</span></div></div>${calDetail()}
  ${hs.length?`<div class="glass"><h2>${t("holMonth")}</h2>${hs.map(k=>`<p style="margin:6px 0"><b>${n(+k.slice(8))}</b> · ${esc(C.hol[k]||t("holiday"))}</p>`).join("")}</div>`:""}
  ${planCards()}`}
function calDetail(){const k=selDay;if(!k)return"";const r=C.att[k],hol=k in C.hol,ab=C.students.filter(s=>r&&r[s.id]==="A"),lt=C.students.filter(s=>r&&r[s.id]==="L"),nm=a=>a.map(s=>esc(s.name)).join(", "),out=(C.start&&k<C.start)||(C.end&&k>C.end);
  return `<div class="glass"><h2>${fmtD(k)} ${out?t("outside"):""}</h2>
  ${hol?`<p style="margin:0 0 8px"><b style="color:var(--L)">${t("holiday")}</b>${C.hol[k]?": "+esc(C.hol[k]):""}</p>`:""}
  ${r?(ab.length?`<label style="margin-top:0">${t("absentL")} (${n(ab.length)})</label><p style="margin:4px 0 8px">${nm(ab)}</p>`:`<p style="margin:0 0 8px">✓ ${t("allHere")}</p>`)+(lt.length?`<label>${t("lateL")} (${n(lt.length)})</label><p style="margin:4px 0 8px">${nm(lt)}</p>`:""):(hol?"":`<p class="sub">${t("noRec")}</p>`)}
  ${C.notes[k]?`<label>${t("note")}</label><p style="margin:4px 0 12px">${esc(C.notes[k])}</p>`:""}
  <button class="btn main" style="width:100%;margin-bottom:8px" onclick="day='${k}';tab='att';render();scrollTo(0,0)">${t("takeAtt")}</button>
  <div class="row" style="margin-bottom:8px"><button class="btn" onclick="setStart('${k}')">▶ ${t("startHere")}</button><button class="btn" onclick="setFinish('${k}')">■ ${t("finishHere")}</button></div>${C.periods.some(q=>q.from===k||q.to===k)?`<button class="btn bad" style="width:100%;margin-bottom:8px" onclick="rmMark('${k}')">${t("rmMark")}</button>`:""}<div class="row"><button class="btn" onclick="holiday('${k}')">${k in C.hol?t("rmHol"):t("markHol")}</button><button class="btn" onclick="noteDay('${k}')">${t("addNote")}</button></div></div>`}
/* ---- start / finish plans ---- */
function setStart(k){if(C.periods.some(q=>q.from===k))return toast(t("done"));C.periods.push({id:uid(),from:k,to:""});C.periods.sort((a,b)=>a.from<b.from?-1:1);save();render();toast(t("saved"))}
function setFinish(k){const o=C.periods.filter(q=>!q.to&&q.from<=k).sort((a,b)=>a.from<b.from?1:-1)[0];if(!o)return toast(t("planNeedStart"));o.to=k;save();render();toast(t("saved"))}
function rmMark(k){const a=C.periods.find(q=>q.from===k);if(a)C.periods=C.periods.filter(q=>q!==a);else{const b=C.periods.find(q=>q.to===k);if(b)b.to=""}save();render();toast(t("done"))}
function delPlan(id){if(!confirm(t("delPlan")+"?"))return;C.periods=C.periods.filter(q=>q.id!==id);save();render()}
function planCards(){if(!C.periods.length)return"";const td=iso(new Date());
  return `<div class="glass"><h2>${t("plans")}</h2>${C.periods.map(q=>{const end=q.to||td,last=end>td?td:end,keys=Object.keys(C.att).filter(k=>k>=q.from&&k<=end),held=keys.length;
    const upto=Math.max(0,Math.round((pd(last)-pd(q.from))/864e5)+1),span=q.to?Math.round((pd(q.to)-pd(q.from))/864e5)+1:upto;
    const hol=Object.keys(C.hol).filter(k=>k>=q.from&&k<=last).length,miss=Math.max(0,upto-hol-held),avg=held?Math.round(keys.reduce((a,k)=>a+counts(k).pct,0)/held):null;
    const rows=C.students.map(s=>{let P=0,A=0,L=0;keys.forEach(k=>{const m=C.att[k][s.id];m==="P"?P++:m==="A"?A++:m==="L"&&L++});return{s,P,A,L}});
    return `<details class="plan"><summary><b>▶ ${fmtD(q.from)} — ■ ${q.to?fmtD(q.to):t("planOpen")}</b><br><small>${t("planDays",n(span))} · ${t("planHeld",n(held))} · ${t("planHol",n(hol))} · ${t("planMiss",n(miss))}${avg===null?"":" · "+t("planAvg",n(avg))}</small></summary>
    ${rows.length?`<table><tr><th>${t("perStu")}</th><th>${t("sP")}</th><th>${t("sA")}</th><th>${t("sL")}</th></tr>${rows.map(r=>`<tr><td>${esc(r.s.name)}</td><td>${n(r.P)}</td><td style="${r.A?"color:var(--A);font-weight:700":""}">${n(r.A)}</td><td>${n(r.L)}</td></tr>`).join("")}</table>`:""}
    <button class="btn bad" style="width:100%;margin-top:10px" onclick="delPlan('${q.id}')">${t("delPlan")}</button></details>`}).join("")}</div>`}
const LOGO=`<svg class="logo" viewBox="0 0 120 120" width="136" height="136" role="img" aria-label="GlassRoll"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#18c7b0"/><stop offset="1" stop-color="#5b6cff"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity=".2"/></linearGradient></defs><rect width="120" height="120" rx="28" fill="url(#g1)"/><rect x="30" y="18" width="60" height="84" rx="13" fill="url(#g2)" stroke="#fff" stroke-opacity=".85" stroke-width="1.5"/><path d="M36 24q24-6 48 0" stroke="#fff" stroke-opacity=".9" stroke-width="2" stroke-linecap="round" fill="none"/><g stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="44" cy="46" r="7" fill="#fff"/><path d="M40.5 46l2.6 2.6 5-5.2" stroke="#12a58f" stroke-width="2.4"/><circle cx="44" cy="66" r="7" fill="#fff"/><path d="M40.5 66l2.6 2.6 5-5.2" stroke="#12a58f" stroke-width="2.4"/><circle cx="44" cy="86" r="7" fill="#fff" fill-opacity=".55"/><path d="M41 86h6" stroke="#5b6cff" stroke-width="2.4"/><path d="M57 46h22M57 66h22M57 86h14" stroke="#fff" stroke-width="4"/></g></svg>`;
function splash(){const el=$("#splash");if(!el)return;el.innerHTML=`${LOGO}<h1>GlassRoll</h1><p>${t("tagline")}</p><button class="btn lb" id="lb"><i id="lbf"></i><span>${t("loading")}</span></button><small>${t("credit")} Remote Studios</small>`;
  let done=false;const open=()=>{if(done)return;done=true;el.classList.add("out");setTimeout(()=>el.remove(),700)};
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const f=$("#lbf");if(f)f.style.transform="scaleX(1)"}));
  setTimeout(()=>{const x=$("#lb span");if(x)x.textContent=t("openApp")},2450);setTimeout(open,2900);el.onclick=open}
try{if("serviceWorker" in navigator&&location.protocol.startsWith("http"))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}catch(e){}
init();render();splash();
</script>
</body>
</html>
